[project]
name = "concierge-for-home-assistant"
version = "1.0.0"
description = "Least privilege access for smart homes"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "gunicorn>=23.0",
    "requests>=2.32",
    "pyyaml>=6.0",
    "werkzeug>=3.1",
]

[project.scripts]
cfh = "concierge_for_home_assistant.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["concierge_for_home_assistant"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["concierge_for_home_assistant"]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]
